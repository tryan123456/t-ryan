[package]
name = "csv-merge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
memchr = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hashbrown = { version = "0.17", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
